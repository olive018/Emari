<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sustainable Rooftop - Learning Demo</title>
    <link rel="stylesheet" href="./style.css?v=2">
</head>
<body>

    <div id="info">
        <h1>Sustainable Rooftop</h1>
        <p>Walk with W A S D or the arrow keys.</p>
        <p>Press E at a glowing marker to learn how it works.</p>
    </div>

    <div id="prompt" class="hidden"></div>

    <!-- Lesson window: filled in by lessons.js -->
    <div id="lesson" class="lesson hidden" role="dialog" aria-modal="true" aria-labelledby="lesson-title">
        <div class="lesson-backdrop" id="lesson-backdrop"></div>

        <div class="lesson-card">
            <button id="lesson-close" class="lesson-close" aria-label="Close lesson">&times;</button>

            <div class="lesson-media" id="lesson-media">
                <img id="lesson-gif" alt="">
                <div class="lesson-missing" id="lesson-missing"></div>
                <span class="lesson-badge" id="lesson-badge"></span>
            </div>

            <div class="lesson-body">
                <p class="lesson-label" id="lesson-label"></p>
                <h2 id="lesson-title"></h2>
                <h3 id="lesson-step-title"></h3>

                <div class="lesson-text" id="lesson-text"></div>
                <div class="lesson-key" id="lesson-key"></div>

                <div class="lesson-nav">
                    <button id="lesson-back" class="btn ghost">&larr; Back</button>
                    <div class="lesson-dots" id="lesson-dots"></div>
                    <button id="lesson-next" class="btn">Next &rarr;</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./main.js?v=2"></script>
</body>
</html>
